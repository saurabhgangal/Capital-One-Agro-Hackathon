version: '3.8'

services:
  # Main Application
  kisan-ai:
    build: .
    container_name: kisan-ai-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MONGODB_URI=mongodb://mongo:27017/kisan-ai
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-kisan-ai-secret-key}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - mongo
      - redis
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
      - ./whatsapp-sessions:/app/whatsapp-sessions
    restart: unless-stopped
    networks:
      - kisan-network

  # MongoDB Database
  mongo:
    image: mongo:6.0
    container_name: kisan-ai-mongo
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password123
      - MONGO_INITDB_DATABASE=kisan-ai
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d
    restart: unless-stopped
    networks:
      - kisan-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: kisan-ai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - kisan-network

  # Nginx Reverse Proxy (Optional)
  nginx:
    image: nginx:alpine
    container_name: kisan-ai-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - kisan-ai
    restart: unless-stopped
    networks:
      - kisan-network

volumes:
  mongo_data:
    driver: local
  redis_data:
    driver: local

networks:
  kisan-network:
    driver: bridge
